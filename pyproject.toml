[project]
name = "agent-send"
version = "0.1.0"
description = "Agent Send: let your agents talk to each other. Request/reply between Hermes and Grok Bot."
readme = "README.md"
authors = [
    { name = "Omid Sayfun", email = "hi@omiid.me" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "mcp", "rpc", "hermes", "grok", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/iamomiid/agent-send"
Issues = "https://github.com/iamomiid/agent-send/issues"
Changelog = "https://github.com/iamomiid/agent-send/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
agent-send = "agent_send.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]
